[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cubesat_thermal"
version = "0.1.0"
description = "Preliminary thermal analysis of a 6U LEO CubeSat"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest"
]
